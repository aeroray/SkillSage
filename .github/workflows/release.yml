name: Release

# Push a SemVer tag (for example v1.0.0) to build and publish the desktop
# installers. The same release also contains signed updater artifacts and
# latest.json for in-app updates on Windows and macOS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing SemVer tag to release, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--config .github/tauri-release.conf.json --bundles nsis"
          - platform: macos-latest
            args: "--config .github/tauri-release.conf.json --target aarch64-apple-darwin --bundles app,dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Add Apple Silicon target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        run: node scripts/set-release-version.mjs "${{ inputs.tag || github.ref_name }}"

      - name: Configure updater endpoint
        run: node scripts/prepare-release-config.mjs

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional macOS signing and notarization secrets. Without these,
          # the workflow still creates unsigned artifacts for testing.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "SkillSage · 技匠 ${{ inputs.tag || github.ref_name }}"
          generateReleaseNotes: true
          releaseBody: |
            ## What's New · 本次更新

            ### 🧰 技能管理

            - 统一管理来自技能商店、本地目录和 GitHub 的 AI Agent 技能。
            - 支持技能版本记录、更新检查、快照回退和冲突处理。
            - 通过「采纳技能」发现并登记共享目录中已有的技能。

            ### 🎨 桌面体验

            - 提供亮色、深色和跟随系统三种显示模式，并支持主题色切换。
            - 以桌面端 1200×800 为基准，围绕 Windows 和 macOS 使用场景优化。

            ## Download · 下载

            - **Windows**：NSIS 安装包，支持简体中文和 English。
            - **macOS（Apple Silicon）**：DMG 安装包。
            - 已安装用户可在应用内检查更新并自动安装。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
