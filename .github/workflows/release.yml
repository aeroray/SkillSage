name: Release

# Push a SemVer tag (for example v1.0.0) to build and publish the desktop
# installers. The same release also contains signed updater artifacts and
# latest.json for in-app updates on Windows and macOS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing SemVer tag to release, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--config .github/tauri-release.conf.json --bundles nsis"
          - platform: macos-latest
            args: "--config .github/tauri-release.conf.json --target aarch64-apple-darwin --bundles app,dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Add Apple Silicon target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        run: node scripts/set-release-version.mjs "${{ inputs.tag || github.ref_name }}"

      - name: Configure updater endpoint
        run: node scripts/prepare-release-config.mjs

      # The release notes live in docs/releases/<tag>.md rather than inline in
      # this workflow, where they previously had to be hand-edited for every
      # release and were silently carried over verbatim if forgotten — which
      # would publish the previous version's notes under the new tag.
      - name: Load release notes
        id: notes
        run: node scripts/load-release-notes.mjs "${{ inputs.tag || github.ref_name }}"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "SkillSage · 技匠 ${{ inputs.tag || github.ref_name }}"
          # Notes come from docs/releases/<tag>.md; the previous inline copy
          # had to be hand-edited per release and was silently reused if
          # forgotten, publishing the old version's notes under the new tag.
          releaseBody: ${{ steps.notes.outputs.body }}
          # Off because the notes are authored in docs/releases/<tag>.md. Leaving
          # it on risks GitHub prepending an auto-generated commit list to them.
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
